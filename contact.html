<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | RAGA — Gang 51</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="floating-decor"></div>
<div id="site-navbar"></div>

<section class="page-hero">
  <div class="container">
    <span class="section-eyebrow">Get In Touch</span>
    <h1>Contact Us</h1>
    <p>We are always on the lookout for passionate individuals ready to make an impact through service. If you have the talent and willingness to serve, we want to hear from you.</p>
  </div>
</section>

<section class="reveal content-page">
  <div class="container contact-layout">
    <h2 class="content-subtitle">Send Us a Message</h2>

    <form action="#" method="post">
      <div class="form-group">
        <label for="name" class="form-label">Name <span class="form-required">*</span></label>
        <input type="text" id="name" name="name" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email <span class="form-required">*</span></label>
        <input type="email" id="email" name="email" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="message" class="form-label">Write a Message</label>
        <textarea id="message" name="message" rows="6" class="form-textarea"></textarea>
      </div>

      <div class="form-submit-wrap">
        <button type="submit" class="btn-primary">Submit</button>
      </div>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="script.js"></script>
</body>
</html>
