<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | RAGA — Gang 51</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="floating-decor"></div>
<div id="site-navbar"></div>

<section class="page-hero">
  <div class="container">
    <span class="section-eyebrow">Moments</span>
    <h1>Gallery</h1>
    <p>Photographs from Gang 51 events and gatherings — add your own images to assets/gallery/.</p>
  </div>
</section>

<section class="reveal">
  <div class="container">
    <div class="gallery-filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="club">Club Service</button>
      <button data-filter="community">Community Service</button>
      <button data-filter="professional">Professional Service</button>
      <button data-filter="international">International Service</button>
      <button data-filter="special">Special Events</button>
    </div>

    <div class="masonry">
      <div class="masonry-item" data-category="club"><img src="assets/gallery/placeholder-1.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="community"><img src="assets/gallery/placeholder-2.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="professional"><img src="assets/gallery/placeholder-3.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="international"><img src="assets/gallery/placeholder-4.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="special"><img src="assets/gallery/placeholder-5.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="club"><img src="assets/gallery/placeholder-6.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="community"><img src="assets/gallery/placeholder-7.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="professional"><img src="assets/gallery/placeholder-8.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="international"><img src="assets/gallery/placeholder-9.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="special"><img src="assets/gallery/placeholder-10.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="club"><img src="assets/gallery/placeholder-11.jpg" alt="Gallery placeholder"></div>
      <div class="masonry-item" data-category="community"><img src="assets/gallery/placeholder-12.jpg" alt="Gallery placeholder"></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="script.js"></script>
</body>
</html>
